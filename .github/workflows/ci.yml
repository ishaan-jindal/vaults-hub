name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least privilege by default; each job declares exactly what it needs.
permissions: {}

# A superseded CI run never publishes anything, so kill it; but release.yml
# calls this workflow on tags, and a release must never be cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install ruff
        # Pinned so a future ruff release cannot change defaults and turn CI red.
        run: pip install ruff==0.15.22
      - name: Ruff lint
        run: ruff check vaults server.py smoke_test.py
      - name: Ruff format check
        run: ruff format --check vaults server.py smoke_test.py
      - name: Smoke test
        # Includes the ripgrep-absent fallback leg, which fails if rg stays on PATH.
        run: python smoke_test.py

  # Independent of `python` on purpose: a Python failure must still surface
  # the npm results in the same run.
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Python dependencies
        # The launcher test points VAULTS_HUB_PYTHON at this interpreter, so it
        # exercises the fast path and needs no network for a venv bootstrap.
        run: python3 -m pip install -r requirements.txt
      - name: Syntax-check launcher
        run: node --check bin/vaults-hub.mjs
      - name: Assert tarball file list
        # A broken package must never be published; the list is exact, so
        # tests, __pycache__ and dotfiles can never sneak in.
        run: |
          set -euo pipefail
          PACK_TMP="$(mktemp -d)"
          trap 'rm -rf "$PACK_TMP"' EXIT
          TARBALL="$PACK_TMP/$(npm pack --pack-destination "$PACK_TMP")"
          diff -u - <(tar -tzf "$TARBALL" | LC_ALL=C sort) <<'EOF'
          package/LICENSE
          package/README.md
          package/bin/vaults-hub.mjs
          package/package.json
          package/requirements.txt
          package/server.py
          package/vaults/__init__.py
          package/vaults/config.py
          package/vaults/indexes.py
          package/vaults/notes.py
          package/vaults/search.py
          package/vaults/server.py
          package/vaults/versioning.py
          EOF
          echo "tarball file list OK"
      - name: Launcher integration test
        run: python3 npm_launcher_test.py
