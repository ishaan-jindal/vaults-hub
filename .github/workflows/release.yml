name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

# Least privilege by default; each job declares exactly what it needs.
permissions: {}

# Never cancel a release: an interrupted publish can leave a tag, dist-tag,
# or GitHub Release inconsistent, so superseded runs must queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release must not be able to ship a broken package: run the full CI.
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    # A workflow_dispatch runs against a branch and must NOT publish.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # id-token: write mints the OIDC token for npm trusted publishing.
      # It belongs on this job only, nowhere else.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Version guard
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "version guard OK: $PKG_VERSION"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # Release jobs must not restore caches: cache poisoning is the
          # documented risk to OIDC token exposure.
          package-manager-cache: false
      - name: Publish to npm
        # Provenance is automatic under trusted publishing from a public repo
        # plus a public package, so no --provenance flag and no NODE_AUTH_TOKEN.
        # A Trusted Publisher mismatch on npmjs.com surfaces as a confusing E404.
        # The exact version already on the registry counts as success, so a
        # re-run after a failed release step still creates the GitHub Release.
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm publish; then
            echo "published v${PKG_VERSION}"
          elif npm view "vaults-hub@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::v${PKG_VERSION} is already on the registry; treating as published"
          else
            echo "::error::npm publish failed and v${PKG_VERSION} is not on the registry"
            exit 1
          fi

  release:
    needs: publish
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # `gh` is preinstalled on GitHub-hosted runners, which is why no
      # third-party release action is used here.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG entry found for version $VERSION" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
