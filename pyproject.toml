[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vaults-hub"
version = "0.2.0"
description = "Stdio MCP server for Obsidian-style Markdown vaults"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ishaan Jindal" }]
dependencies = [
  "anyio==4.15.1",
  "mcp==1.30.0",
  "PyYAML==6.0.3",
]

[project.scripts]
vaults-hub = "vaults.server:main"

[tool.setuptools]
packages = ["vaults"]

[tool.ruff]
line-length = 100
